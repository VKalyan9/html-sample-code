<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Landing Page</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0537ab;
      color:white;
    }

    /* NAVBAR */

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 8%;
      background:#070d13;
      position:sticky;
      top:0;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#38bdf8;
    }

    .nav-links{
      display:flex;
      gap:25px;
      list-style:none;
    }

    .nav-links a{
      text-decoration:none;
      color:white;
      transition:0.3s;
    }

    .nav-links a:hover{
      color:#38bdf8;
    }

    /* HERO SECTION */

    .hero{
      min-height:100vh;
      background:url('https://images.unsplash.com/photo-1498050108023-c5249f4df085')
      center/cover no-repeat;

      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px;
    }

    .hero-content{
      background:rgba(0,0,0,0.6);
      padding:40px;
      border-radius:15px;
      max-width:1000px;
      width:100%;

      display:flex;
      gap:40px;
      align-items:center;
    }

    .left{
      flex:1;
    }

    .right{
      flex:1;
    }

    h1{
      font-size:55px;
      margin-bottom:20px;
    }

    p{
      font-size:18px;
      line-height:1.7;
      margin-bottom:25px;
    }

    button{
      padding:14px 30px;
      border:none;
      background:#38bdf8;
      color:white;
      font-size:18px;
      border-radius:8px;
      cursor:pointer;
      transition:0.4s;
    }

    /* HOVER EFFECT */

    button:hover{
      background:#0ea5e9;
      transform:scale(1.08);
    }

    .card{
      background:white;
      color:black;
      padding:30px;
      border-radius:12px;
      transition:0.4s;
    }

    .card:hover{
      transform:translateY(-10px);
    }

    /* TABLET VIEW */

    @media(max-width:992px){

      .hero-content{
        flex-direction:row;
        gap:20px;
      }

      h1{
        font-size:40px;
      }

      p{
        font-size:16px;
      }

    }

    /* MOBILE VIEW */

    @media(max-width:768px){

      nav{
        flex-direction:column;
        gap:15px;
      }

      .nav-links{
        flex-direction:column;
        align-items:center;
      }

      .hero-content{
        flex-direction:column;
        text-align:center;
      }

      h1{
        font-size:32px;
      }

      p{
        font-size:14px;
      }

      button{
        width:100%;
      }

    }

  </style>
</head>
<body>

  <!-- NAVBAR -->

  <nav>
    <div class="logo">
        <img src="file:///C:/Users/vatte/Downloads/png-clipart-red-and-multicolored-bird-hummingbird-logo-drawing-others-miscellaneous-blue-thumbnail-removebg-preview-removebg-preview.png" alt="Logo" width="32" height="32">
    </div>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO SECTION -->

  <section class="hero">

    <div class="hero-content">

      <!-- LEFT SIDE -->

      <div class="left">

        <h1>Build Responsive Websites</h1>

        <p>
          Learn HTML, CSS, Flexbox, Media Queries,
          Hover Effects and Responsive Design by
          building real-world landing pages.
        </p>

        <button>Get Started</button>

      </div>

      <!-- RIGHT SIDE -->

      <div class="right">

        <div class="card">
          <h2>Responsive Design</h2>

          <p>
            This layout changes perfectly for
            Mobile, Tablet and Desktop screens.
          </p>
        </div>

      </div>

    </div>

  </section>

</body>
</html>
