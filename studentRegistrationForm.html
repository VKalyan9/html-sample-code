<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    <body>
        <h1>Student Registration Form</h1>
        <form action="/submit" method="post">
            <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="Password">Password:</label>
                <input type="password" id="Password" name="Password" required><br><br>

                <label for="radio">Gender:</label>
                <input type="radio" id="radio" name="gender" value="male" required>
                <label for="radio">Male</label>
                <input type="radio" id="radio" name="gender" value="female" required>
                <label for="radio">Female</label><br><br>

                 <label for="dropdown">Department</label>
                <select id="dropdown" name="department" required>
                    <option value="">Select a department</option>
                    <option value="computer_science">Computer Science</option>
                    <option value="business">Business</option>
                    <option value="engineering">Engineering</option>
                    <option value="arts">Arts</option>
                </select><br><br>

                <label for="text">Address:</label>
                <input type="text" id="text" name="address" required><br><br>

                <input type="submit" value="Submit">
            </form>
        </body>
        </head>
        </html>
